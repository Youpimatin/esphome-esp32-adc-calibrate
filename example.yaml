esphome:
  name: esp32-adc-calibration

esp32:
  variant: esp32
  framework:
    type: arduino

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

substitutions:
  adc_cal_pin: "35"
  adc_cal_dac_pin: "25"

  adc_cal_samples: "16"
  adc_cal_settle_ms: "5"

packages:
  adc_calibration:
    url: https://github.com/Youpimatin/esphome-esp32-adc-calibrate
    files:
      - path: package.yaml
    ref: main
    refresh: 1d
